<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; background:#f1f3f6; padding:20px;">
    <div style="max-width:1000px; margin:0 auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
        <h2>🛠️ Phone Store Kenya Admin Panel</h2>
        <form method="POST" style="max-width:400px; margin-bottom:30px;">
            <input type="hidden" name="add_phone" value="1">
            <input type="text" name="name" placeholder="Device Full Name" required style="width:100%; padding:10px; margin-bottom:10px;"><br>
            <input type="number" name="price" placeholder="Price (KSh)" required style="width:100%; padding:10px; margin-bottom:10px;"><br>
            <textarea name="description" placeholder="Specs details" required style="width:100%; padding:10px; margin-bottom:10px;"></textarea><br>
            <input type="hidden" name="image" value="vector_css">
            <button type="submit" style="background:#FF6700; color:white; border:none; padding:10px; width:100%; font-weight:700; cursor:pointer;">Save Product</button>
        </form>
        <h3>Active Stock</h3>
        <table style="width:100%; border-collapse:collapse;">
            {% for phone in phones %}
            <tr style="border-bottom:1px solid #ddd; padding:10px 0;"><td>#{{ phone.id }}</td><td><strong>{{ phone.name }}</strong></td><td>KSh {{ "{:,}".format(phone.price) }}</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
