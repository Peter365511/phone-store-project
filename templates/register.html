<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; background:#f9fafb; padding:40px; text-align:center;">
    <div style="max-width:400px; margin:0 auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
        <h2>Create Account</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Choose Username" required style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;"><br>
            <input type="password" name="password" placeholder="Choose Secure Password" required style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;"><br>
            <button type="submit" style="background:#FF6700; color:white; border:none; padding:12px; width:100%; border-radius:8px; font-weight:700; cursor:pointer;">Register Account</button>
        </form>
    </div>
</body>
</html>
