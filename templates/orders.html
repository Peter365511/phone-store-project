<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; background:#f9fafb; padding:40px;">
    <div style="max-width:600px; margin:0 auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
        <h2>📋 My Purchase History</h2>
        {% if orders %}
            {% for order in orders %}
            <div style="background:#f4f6f9; padding:15px; margin-bottom:10px; border-radius:8px;">
                <h3>Item: {{ order.item_name }}</h3>
                <p>Paid: KSh {{ "{:,}".format(order.amount) }}</p>
                <p>Status: <strong style="color:#27ae60;">{{ order.status }}</strong></p>
            </div>
            {% endfor %}
        {% else %}
            <p style="color:#666;">No paid orders found.</p>
        {% endif %}
        <a href="/" style="display:inline-block; margin-top:15px; color:#FF6700; font-weight:bold; text-decoration:none;">← Return to Shop</a>
    </div>
</body>
</html>
