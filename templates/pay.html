<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Secure Checkout - Phone Store Kenya</title>
    <style>
        :root {
            --bg-primary: #f9fafb;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --brand-primary: #FF6700;
            --border-color: #f1f5f9;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg-primary); color: var(--text-main); margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .checkout-box { max-width: 500px; width: 100%; background: var(--bg-card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        h2 { margin-top: 0; color: var(--text-main); font-weight: 800; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .item-details { background: var(--bg-primary); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .price-display { font-size: 1.5rem; font-weight: 800; color: var(--brand-primary); margin: 10px 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: 10px; box-sizing: border-box; outline: none; font-size: 1rem; }
        input:focus { border-color: var(--brand-primary); }
        .pay-btn { background: var(--brand-primary); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; transition: background 0.2s; box-shadow: 0 4px 12px rgba(255,103,0,0.15); }
        .pay-btn:hover { background: #e05300; }
        .cancel-link { display: block; text-align: center; margin-top: 15px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="checkout-box">
        <h2>🔒 Secure M-Pesa Checkout</h2>
        
        <div class="item-details">
            <span style="font-size: 0.8rem; text-transform: uppercase; font-weight: 800; color: var(--brand-primary);">Reviewing Order</span>
            <h3 style="margin: 5px 0 10px 0;">{{ phone.name }}</h3>
            <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">{{ phone.description }}</p>
            <div class="price-display">KSh {{ "{:,}".format(phone.price) }}</div>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Enter Safaricom Phone Number (Lipa Na M-Pesa)</label>
                <input type="text" name="phone_number" placeholder="e.g., 0712345678 or 254712345678" required>
                <small style="color: var(--text-muted); display: block; margin-top: 6px; font-size: 0.8rem;">An STK Push PIN prompt will be sent instantly to this handset screen.</small>
            </div>
            <button type="submit" class="pay-btn">Request M-Pesa STK Push</button>
        </form>
        
        <a href="/" class="cancel-link">← Cancel and return to Catalog</a>
    </div>

</body>
</html>
